name: Docs
description: A mistake, gap, or translation issue in the cmux-herdr plugin docs
title: "[Docs] "
labels: ["documentation"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      description: File or URL (for example `README.md`, `docs/de/README.md`).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should change
    validations:
      required: true

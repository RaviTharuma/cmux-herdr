# Publish checksum-verified Rust binaries when a vX.Y.Z tag is pushed.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Tag must match VERSION
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          test "v${file_version}" = "${GITHUB_REF_NAME}"
      - name: Verify Rust runtime
        run: ./scripts/test.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Offline packaging on native shell
        run: |
          bash tests/packaging.sh
          python3 tests/packaging_release.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Name release asset
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          cp "target/${{ matrix.target }}/release/cmux-herdr" \
            "cmux-herdr-${version}-${{ matrix.target }}"
          asset="cmux-herdr-${version}-${{ matrix.target }}"
          chmod +x "$asset"
          test "$(./"$asset" --version)" = "cmux-herdr ${version}"
          ./"$asset" --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: cmux-herdr-${{ matrix.target }}
          path: cmux-herdr-*-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: cmux-herdr-*
          path: dist
          merge-multiple: true
      - name: Create checksums and release notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum cmux-herdr-* > SHA256SUMS)
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]([[:space:]]|$)" { printing=1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          assets=()
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            asset="dist/cmux-herdr-${version}-${target}"
            test -s "$asset"
            assets+=("$asset")
          done
          test "$(find dist -type f | wc -l)" -eq 5
          test "$(wc -l < dist/SHA256SUMS)" -eq 4
          (cd dist && sha256sum --strict -c SHA256SUMS)
          # Creation is the exclusion gate: an existing draft/published tag is never edited.
          gh release create "$tag" --draft --verify-tag --title "$tag" --notes-file /tmp/notes.md \
            "${assets[@]}" dist/SHA256SUMS
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$tag" --dir "$verify_dir"
          test "$(find "$verify_dir" -type f | wc -l)" -eq 5
          for asset in "${assets[@]}" dist/SHA256SUMS; do
            cmp "$asset" "$verify_dir/${asset##*/}"
          done
          (cd "$verify_dir" && sha256sum --strict -c SHA256SUMS)
          gh release edit "$tag" --draft=false --latest

# Publish checksum-verified Rust binaries when a vX.Y.Z tag is pushed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Tag must match VERSION
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          test "v${file_version}" = "${GITHUB_REF_NAME}"
      - name: Verify Rust runtime
        run: ./scripts/test.sh

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Name release asset
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          cp "target/${{ matrix.target }}/release/cmux-herdr" \
            "cmux-herdr-${version}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cmux-herdr-${{ matrix.target }}
          path: cmux-herdr-*-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: cmux-herdr-*
          path: dist
          merge-multiple: true
      - name: Create checksums and release notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum cmux-herdr-* > SHA256SUMS)
          awk -v version="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" version "\\]([[:space:]]|$)" { printing=1; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" --title "${tag}" --notes-file /tmp/notes.md --latest
            gh release upload "${tag}" --clobber dist/cmux-herdr-* dist/SHA256SUMS
          else
            gh release create "${tag}" --title "${tag}" --notes-file /tmp/notes.md --latest \
              dist/cmux-herdr-* dist/SHA256SUMS
          fi

name: bump-title-lock-landed
on:
  push:
    paths:
      - .github/workflows/bump-title-lock-landed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/title-lock-status-1738
      - name: Mark title-lock landed in ERRORS progress table
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/upstream/ERRORS_AND_LACKINGS.md')
          text = p.read_text()
          old = '| Native title-lock association file | **shipping** \u2014 `RemoteHerdrAssociationStore` + NestedPluginWriterHandoff TTL |'
          new = '| Native title-lock association file | **landed** \u2014 `RemoteHerdrAssociationStore` + NestedPluginWriterHandoff TTL (`b302316e` / #23) |'
          if old not in text:
              # already updated or dash variant
              alt_old = '| Native title-lock association file | **shipping** — `RemoteHerdrAssociationStore` + NestedPluginWriterHandoff TTL |'
              if alt_old in text:
                  old = alt_old
              else:
                  raise SystemExit('old line not found:\n' + '\n'.join(l for l in text.splitlines() if 'title-lock' in l.lower() or 'AssociationStore' in l))
          p.write_text(text.replace(old, new, 1))
          print('updated')
          PY
      - name: Commit and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "Ravi Tharuma"
          git config user.email "25951435+RaviTharuma@users.noreply.github.com"
          rm -f .github/workflows/bump-title-lock-landed.yml
          git add -A
          git commit -m "docs: mark title-lock association wire landed"
          git push origin HEAD:cursor/title-lock-status-1738

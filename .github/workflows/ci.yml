# cmux-herdr CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run stdlib unittest suite
        run: ./scripts/test.sh
      - name: Guard against committed dumps and obvious secrets
        run: |
          set -euo pipefail
          if [ -e docs/live-env-snapshot.txt ]; then
            echo "docs/live-env-snapshot.txt must not be committed"
            exit 1
          fi
          if git grep -I -nE 'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----' -- . \
            ':!.github/workflows/ci.yml'; then
            echo "Possible secret material in the tree"
            exit 1
          fi
